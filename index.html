<html lang="id">

    <meta property="og:title" content="Sistem Satu Data Kesehatan RW (CKG Terintegrasi)" />
    <meta property="og:description" content="Aplikasi PWA Sistem Satu Data Cek Kesehatan Gratis (CKG) Terintegrasi RW dengan 5 Multi-User Role, QR Scanner, Early Warning System, Cetak Struk Thermal, dan Ekspor Excel." />

    <link rel="manifest" href="/manifest.json" />

  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((registration) => {
            console.log('SW terdaftar dengan scope:', registration.scope);
          }).catch((err) => {
            console.log('SW registrasi gagal:', err);
          });
        });
      }
    </script>
  </body>

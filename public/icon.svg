<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Background with safe padding for maskable icon -->
  <rect width="512" height="512" rx="110" fill="url(#grad1)" />
  
  <!-- Inner White Card / Shield -->
  <rect x="76" y="76" width="360" height="360" rx="60" fill="#ffffff" filter="url(#shadow)" opacity="0.96" />

  <!-- Heart Pulse and Cross Symbol -->
  <g transform="translate(136, 120)">
    <!-- Red/Emerald Medical Plus -->
    <path d="M100 30 L140 30 L140 70 L180 70 L180 110 L140 110 L140 150 L100 150 L100 110 L60 110 L60 70 L100 70 Z" fill="#10B981" />
    
    <!-- Heart shape overlay -->
    <path d="M120 180 C80 140, 20 170, 20 220 C20 270, 70 300, 120 340 C170 300, 220 270, 220 220 C220 170, 160 140, 120 180 Z" fill="#EF4444" opacity="0.9" />

    <!-- Pulse ECG Line -->
    <path d="M40 230 L85 230 L100 200 L115 250 L130 215 L145 230 L200 230" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- RW Community text badge -->
  <rect x="156" y="405" width="200" height="42" rx="21" fill="#047857" />
  <text x="256" y="432" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">SATU DATA RW</text>
</svg>
